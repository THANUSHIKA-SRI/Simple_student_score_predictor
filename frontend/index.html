<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Score Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Score Predictor</h1>

        <p>Enter the student's details to predict their score.</p>

        <label for="hours">Hours Studied</label>
        <input type="number" id="hours" placeholder="Example: 7">

        <label for="attendance">Attendance (%)</label>
        <input type="number" id="attendance" placeholder="Example: 85">

        <button onclick="predictScore()">Predict Score</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
